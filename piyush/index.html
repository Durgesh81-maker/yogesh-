<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess The Color Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1>🎨 Guess The Color</h1>
    <div id="colorBox"></div>

    <div class="buttons">
        <button onclick="checkColor('Red')">Red</button>
        <button onclick="checkColor('Green')">Green</button>
        <button onclick="checkColor('Blue')">Blue</button>
    </div>

    <p id="result"></p>
    <p>Score: <span id="score">0</span></p>

    <button class="reset" onclick="newGame()">New Color</button>
</div>

<script src="script.js"></script>
</body>
</html>
